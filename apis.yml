name: Blue Frog Gaming
description: >-
  Blue Frog Gaming is a small independent game studio founded in 2007 by Matt
  Maroon and backed by Y Combinator (Summer 2007 batch), based in Akron, Ohio.
  The company builds browser-based and social strategy games, best known for
  Starfleet Commander — a persistent, multi-universe game of resource
  management, alliance building, and fleet combat — along with Stardrift
  Empires (built with Syfy Games) and the sci-fi MMO ShadowRift. Blue Frog
  Gaming is a consumer game developer rather than an API-first platform: as of
  this profile it publishes no public developer portal, API documentation, SDKs,
  or machine-readable API description. This record is maintained in the API
  Evangelist network as a company profile; it will be upgraded if and when a
  public API surface is discovered.
